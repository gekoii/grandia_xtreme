  undefined_funcs_auto_path: linker_scripts/undefined_funcs_auto.battle.txt
  undefined_syms_auto_path: linker_scripts/undefined_syms_auto.battle.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False


name: Grandia Xtreme (USA) - viewer overlay
sha1: ac36fdc130674229a2a27665cbcfc46e40713e98
options:
  basename: viewer
  # Raw code overlay, loaded by the main executable at 0x00700000 (.lay_viewer)
  target_path: iso/VIEWER.BIN
  elf_path: build/viewer.elf
  base_path: ..
  platform: ps2
  compiler: EEGCC

  gp_value: 0x004B1470

  asm_path: asm/viewer
  src_path: src
  build_path: build
  ld_script_path: linker_scripts/viewer.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # The overlay files hold their .bss as zeros: link it as contents
  ld_bss_is_noload: False

  create_asm_dependencies: True
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.viewer.txt
  reloc_addrs_path:
    - config/reloc_addrs.viewer.txt
  undefined_funcs_auto_path: linker_scripts/undefined_funcs_auto.viewer.txt
  undefined_syms_auto_path: linker_scripts/undefined_syms_auto.viewer.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

segments:
  - name: viewer
    type: code
    start: 0x000000
    vram: 0x00700000
    subalign: null
    subsegments:
      # BEGIN text subsegments (generated by tools/update_segments.py)
      - [0x000000, c, viewer/700000]
      - [0x000058, c, viewer/700058]
      - [0x0003F8, c, viewer/7003F8]
      - [0x000400, c, viewer/700400]
      - [0x000648, c, viewer/700648]
      - [0x0006E8, c, viewer/7006E8]
      - [0x000A10, c, viewer/700A10]
      - [0x000A88, c, viewer/700A88]
      - [0x000DC0, c, viewer/700DC0]
      - [0x000E38, c, viewer/700E38]
      - [0x001108, c, viewer/701108]
      - [0x0012C8, c, viewer/7012C8]
      - [0x001398, c, viewer/701398]
      - [0x001408, c, viewer/701408]
      - [0x0014A8, c, viewer/7014A8]
      - [0x0015E8, c, viewer/7015E8]
      - [0x001700, c, viewer/701700]
      - [0x001810, c, viewer/701810]
      - [0x001850, c, viewer/701850]
      - [0x001980, c, viewer/701980]
      - [0x001988, c, viewer/701988]
      - [0x0019A8, c, viewer/7019A8]
      - [0x001BC0, c, viewer/701BC0]
      - [0x001C00, c, viewer/701C00]
      - [0x0027D8, c, viewer/7027D8]
      - [0x0028D8, c, viewer/7028D8]
      - [0x0029D8, c, viewer/7029D8]
      - [0x002E08, c, viewer/702E08]
      - [0x0031A8, c, viewer/7031A8]
      - [0x0032E0, c, viewer/7032E0]
      - [0x003308, c, viewer/703308]
      - [0x003328, c, viewer/703328]
      - [0x00334C, asm, viewer/00334C]
      # END text subsegments
      # Sections after the code (see docs/shifting.md for the evidence): no
      # .data; .rodata (from the first file's "save" string), then .bss
      # (128-aligned, 0x00703500), which is zeros in the file
      # .rodata: C files' jump tables and constants are cut into it in place
      # BEGIN rodata subsegments (generated by tools/update_segments.py)
      - [0x003380, .rodata, viewer/data/703380]
      - [0x003388, .rodata, viewer/700400]
      - [0x0033D0, .rodata, viewer/700E38]
      - [0x0033D8, .rodata, viewer/7012C8]
      - [0x003400, .rodata, viewer/data/703400]
      - [0x003410, .rodata, viewer/701700]
      - [0x003420, .rodata, viewer/data/703420]
      - [0x003428, .rodata, viewer/7019A8]
      - [0x003438, .rodata, viewer/data/703438]
      - [0x003440, .rodata, viewer/7027D8]
      - [0x003448, .rodata, viewer/7028D8]
      - [0x003450, .rodata, viewer/data/703450]
      - [0x003488, .rodata, viewer/data/703488]
      - [0x0034C4, .rodata, viewer/7031A8]
      - [0x0034CC, rodata, viewer/0034CC]
      # END rodata subsegments
      - [0x0034D0, .bss, viewer/bss_703500] # .bss (from 0x00703500, 128-aligned)
  - [0x00DF44]
